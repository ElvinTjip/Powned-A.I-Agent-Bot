[tool.poetry]
name = "powned-agent"
version = "0.1.0"
description = "PowNed Redactie Agent — automated relevance feed for editorial team"
authors = ["PowNed"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
feedparser = "^6.0"
httpx = "^0.27"
beautifulsoup4 = "^4.12"
anthropic = "^0.26"
apscheduler = "^3.10"
jinja2 = "^3.1"
python-multipart = "^0.0.9"
authlib = "^1.3"
python-dotenv = "^1.0"
itsdangerous = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
